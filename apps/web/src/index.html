<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>OneApp</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <div id="root"></div>
    <dialog id="cli-token-dialog" aria-labelledby="cli-token-title">
      <h2 id="cli-token-title">CLI token created</h2>
      <p>Copy this token into your terminal. It’s shown once.</p>
      <label for="issued-cli-token">CLI token</label>
      <textarea
        id="issued-cli-token"
        rows="2"
        readonly
        spellcheck="false"
        autocomplete="off"
      ></textarea>
      <form method="dialog"><button>Done</button></form>
    </dialog>
  </body>
</html>
